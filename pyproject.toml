[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microtensor-engine"
version = "0.1.0"
description = "Run Microtensor certified specialists from Python, hosted or in your own environment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
local = [
    "microtensor-subnet[serving] @ git+https://github.com/microtensor-io/microtensor-subnet.git",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://www.microtensor.cloud"
Documentation = "https://www.microtensor.cloud/docs/integrations/enterprise/engine"
Repository = "https://github.com/microtensor-io/microtensor-engine"

[tool.setuptools.packages.find]
include = ["microtensor*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
